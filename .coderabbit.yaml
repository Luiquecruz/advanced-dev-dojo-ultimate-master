# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Concise and technical. Cite the project rule or document a finding comes from. No praise, no summaries of unchanged code."

reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  sequence_diagrams: false
  suggested_labels: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
    - "!vendor/**"
    - "!**/__pycache__/**"
  path_instructions:
    - path: "src/content/**"
      instructions: |
        Lesson content. The contract is .claude/docs/CONTENT_GUIDE.md (Python track: .claude/docs/python-track/02-content-standards.md).
        - Facts, APIs and versions in theory.md, quiz.json and concepts.json must be correct for the versions in CONTENT_GUIDE.md "Installed versions"; flag outdated or invented APIs.
        - challenge.md names every export, signature and behavior the tests rely on.
        - The starter is incomplete on purpose: TODO markers, missing logic and failing tests are expected there, never report them as bugs. Review the solution as production code.
        - hints.md climbs from nudge to near-answer (2-4 hints separated by ---) and approach.md never pastes the solution.
        - Tests assert behavior, not printed text; 3-6 tests per challenge.
        - Quiz answers are correct and the explanation names the mechanism.
        - English only.
    - path: "src/content/python/**"
      instructions: |
        The CURRICULUM.md Python section is generated by `npm run python:curriculum`: changes there must come from the generator, not hand edits.
        Follow the Definition of Done in .claude/docs/python-track/11-working-agreement.md.
    - path: "src/{engines,sandbox}/**"
      instructions: |
        Grading engines and the sandbox run untrusted learner code. Treat isolation as security-critical:
        - learner code must not reach the app window, the host, environment variables, the network or a real model (the fake model in src/engines/shared/fakeModel.ts is the only provider);
        - learner code imports only what the engine's registry.ts registers;
        - flag any widened postMessage surface, eval of host strings, or removed timeout or loop guard.
        A change to the Python engine, harness or worker must keep both the python and ai-engineering verify suites passing.
    - path: "src/verify/**"
      instructions: |
        Lesson verification. pythonSandbox* forks a child under the Node permission model with an empty env: flag any widened --allow-* flag, inherited env, or access to fs, child_process or network from lesson code.
        A new track suite must also be added to the verify matrix and the structure exclusion list in .github/workflows/ci.yml.
    - path: "src/shared/**"
      instructions: |
        Shared layer: framework-agnostic, no course knowledge. It must never import src/content, src/engines or src/sandbox (enforced by src/architecture.test.ts).
    - path: "src/{app,pages,features,entities,shared}/**"
      instructions: |
        Feature-sliced layers (.claude/docs/ARCHITECTURE.md): no imports of a sibling slice of the same layer, other slices only through their index.ts, relative imports stay inside their slice.
        Performance rules from .claude/CLAUDE.md: animate only transform, opacity and clip-path; values written every frame are registered @property with inherits: false and written on the consuming element; every effect respects prefers-reduced-motion and has a fallback.
        Accessibility: one exposed <main>, inert (never aria-hidden) on inactive layers, no skipped heading levels, touch targets of at least 24px.
        Never call progress.* or another external store inside a setState updater.
    - path: "src/shared/design/tokens.css"
      instructions: |
        Tokens are the single source of truth. Track accents must stay AA on void, panel and elevated, AA under dark text, and at least 30 degrees of hue from every other accent (src/verify/trackPresentation.test.ts).
    - path: ".github/**"
      instructions: |
        Workflows keep least-privilege permissions, never expose secrets to jobs that run lesson code (verify), and pin actions to a major version. CI and deploy are described in .claude/docs/CONTRIBUTING.md "CI and deploy"; flag changes that make it stale.
    - path: "netlify.toml"
      instructions: |
        The Content-Security-Policy for /assets/python.worker-* must equal PYTHON_WORKER_CSP in plugins/pythonWorkerCspPlugin.ts, and the SPA fallback to /index.html must stay (BrowserRouter).
    - path: "{README.md,.claude/**/*.md}"
      instructions: |
        Documentation describes the current state, not a changelog. Flag statements that contradict the code in the same pull request, broken relative links, and non-English text (the visual spec in .claude/specs/ is the only Portuguese document).
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: |
        Conventional commit format: `type(scope): subject` or `type: subject` (the scope is optional).
        Types: feat, fix, docs, perf, refactor, test, chore, ci.
        Scope, when present, is one of: typescript, react, react-state, architecture, ai-engineering, node, python, vue, angular, engines, sandbox, verify, content, curriculum, lesson, routing, scene, motion, ui, deps, ci, review, docs, harness.
        The subject starts with a lowercase imperative verb (add, fix, remove, update, move, mark...); product and language names keep their casing after it (add CodeRabbit configuration). No trailing period.
    description:
      mode: "warning"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "Lessons listed in the curriculum"
        mode: "warning"
        instructions: |
          Pass when the pull request adds or renames no lesson folder with a meta.json under src/content/<track>/<NN-module>/<NN-lesson>/.
          Otherwise pass only when .claude/docs/CURRICULUM.md in the same pull request marks every added or renamed lesson with ✓ and removes renamed entries. For src/content/python the Python section must match the output of `npm run python:curriculum`.
      - name: "New track registered everywhere"
        mode: "warning"
        instructions: |
          Pass when the pull request adds no new src/content/<id>/track.json.
          Otherwise pass only when the same pull request adds a [data-trail='<id>'] rule in src/shared/design/tokens.css, src/verify/<id>.test.ts, the id in the verify matrix and structure exclusion list of .github/workflows/ci.yml, the track in the README.md tracks table, and its plan in .claude/docs/CURRICULUM.md.
  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    reactDoctor:
      enabled: false
    stylelint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - ".claude/docs/CONTRIBUTING.md"
      - files: ".claude/docs/ARCHITECTURE.md"
        applyTo: "src/**,plugins/**,sandbox.html,index.html"
      - files: ".claude/docs/CONTENT_GUIDE.md"
        applyTo: "src/content/**,src/engines/**,src/verify/**"
      - files: ".claude/docs/python-track/02-content-standards.md,.claude/docs/python-track/11-working-agreement.md"
        applyTo: "src/content/python/**,src/engines/python/**,scripts/python-track/**"
