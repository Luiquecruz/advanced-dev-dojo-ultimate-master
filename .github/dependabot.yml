version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait 14 days after a release before proposing it, so a hijacked or broken release is usually caught and pulled
    # first (GitHub Actions supports only default-days). Security updates are not delayed.
    cooldown:
      default-days: 14
    labels:
      - dependencies
      - github_actions
      - "docs:none"
    groups:
      actions:
        patterns:
          - "*"
