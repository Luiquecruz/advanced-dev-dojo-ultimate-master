name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@v4
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build

  verify:
    name: Verify ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - structure
          - typescript
          - react
          - react-state
          - architecture
          - ai-engineering
          - node
          - python
          - vue
          - angular
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@v4
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "structure" ]; then
            npx vitest run $(ls src/verify/*.test.ts | grep -v -E '/(typescript|react|react-state|architecture|ai-engineering|node|python|vue|angular)\.test\.ts$')
          else
            npx vitest run "src/verify/$SUITE.test.ts"
          fi
      - if: matrix.suite == 'structure'
        run: npm run python:curriculum -- --check
