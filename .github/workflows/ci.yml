name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: a new push cancels the run still going. main: one group per commit, so every commit on main gets a full run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The DSN ends up in the main bundle, so CI builds with the value production uses. A DSN is public (it is in the served
# JavaScript); the repository variable lets the owner change it, and the fallback is the current project's DSN. The commit
# SHA reaches the bundle too, as the Sentry release (vite.config.ts): GITHUB_SHA in CI.
env:
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || 'https://4f0ce69f51f3b8886d94bc586fed1ad0@o4512380997074944.ingest.us.sentry.io/4512381161308160' }}

jobs:
  changes:
    name: Detect affected checks
    # Pull requests run only the jobs their changed files need (scripts/ci/affected-checks.mjs); pushes to main and manual
    # runs run everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.affected.outputs.suites }}
      python: ${{ steps.affected.outputs.python }}
      code: ${{ steps.affected.outputs.code }}
      workflows: ${{ steps.affected.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/ci/affected-checks.mjs --base "origin/$BASE_REF"
          else
            node scripts/ci/affected-checks.mjs --all
          fi

  checks:
    name: Lint, typecheck, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - name: Cache the .NET runtime and C# engine files (never the manifest; re-verified against the committed one by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/dotnet
            !vendor/dotnet/manifest.json
            !vendor/dotnet/.cache
          key: dotnet-${{ hashFiles('vendor/dotnet/manifest.json', 'scripts/csharp-track/vendor-dotnet.mjs', 'scripts/csharp-track/WebcilConvert.cs', 'src/engines/csharp/host/*.cs') }}
      - run: npm ci
      - name: The install reproduced the committed vendor/dotnet/manifest.json
        run: git diff --exit-code vendor/dotnet/manifest.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build
      - name: Smoke test the build under vite preview (worker CSP, SPA fallback, Pyodide files)
        run: npm run smoke:worker-csp

  pr-size:
    name: Pull request size (CodeRabbit reviews at most 300 files)
    # CodeRabbit skips a pull request with more than 300 changed files, so it would merge unreviewed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Count changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          count=$(git diff --name-only "origin/$BASE_REF...HEAD" | wc -l)
          echo "Changed files: $count (limit 300)"
          if [ "$count" -gt 300 ]; then
            echo "::error title=Pull request too large::$count changed files; CodeRabbit reviews at most 300. Split it into stacked pull requests (CONTRIBUTING.md \"Pull request size\")."
            exit 1
          fi

  python:
    name: Python lessons on CPython (pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - run: python -m pip install --require-hashes -r tests/python/requirements.txt
      - run: python -m pytest

  workflows:
    name: Lint workflows (actionlint, zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Security audits of the workflows themselves (template injection, excessive permissions, unpinned uses,
      # dangerous triggers). Offline: no GitHub API calls, so it needs no token.
      - run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity low .github/workflows

  # One suite per affected track (src/content/<id>/track.json runs src/verify/<id>.test.ts) plus `structure`; a track
  # without its suite fails its job, since Vitest finds no test file.
  verify:
    name: Verify ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - name: Cache the .NET runtime and C# engine files (never the manifest; re-verified against the committed one by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/dotnet
            !vendor/dotnet/manifest.json
            !vendor/dotnet/.cache
          key: dotnet-${{ hashFiles('vendor/dotnet/manifest.json', 'scripts/csharp-track/vendor-dotnet.mjs', 'scripts/csharp-track/WebcilConvert.cs', 'src/engines/csharp/host/*.cs') }}
      - run: npm ci
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "structure" ]; then
            suites=()
            for file in src/verify/*.test.ts; do
              if [ ! -f "src/content/$(basename "$file" .test.ts)/track.json" ]; then
                suites+=("$file")
              fi
            done
            npx vitest run "${suites[@]}"
          else
            npx vitest run "src/verify/$SUITE.test.ts"
          fi
      - if: matrix.suite == 'structure'
        run: npm run python:curriculum -- --check

  verify-result:
    name: Verify result
    # The one required check for the verify matrix: it passes when every affected suite passed or none was affected.
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "changes: $CHANGES_RESULT, verify: $VERIFY_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || { [ "$VERIFY_RESULT" != "success" ] && [ "$VERIFY_RESULT" != "skipped" ]; }; then
            exit 1
          fi
