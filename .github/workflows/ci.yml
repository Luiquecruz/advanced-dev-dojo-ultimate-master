name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@v6
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build
      - name: Smoke test the build under vite preview (worker CSP, SPA fallback, Pyodide files)
        run: npm run smoke:worker-csp
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  python:
    name: Python lessons on CPython (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - run: python -m pip install --require-hashes -r tests/python/requirements.txt
      - run: python -m pytest

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  verify:
    name: Verify ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - structure
          - typescript
          - react
          - react-state
          - architecture
          - ai-engineering
          - node
          - python
          - vue
          - angular
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@v6
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "structure" ]; then
            suites=()
            for file in src/verify/*.test.ts; do
              case "$(basename "$file" .test.ts)" in
                typescript|react|react-state|architecture|ai-engineering|node|python|vue|angular) ;;
                *) suites+=("$file") ;;
              esac
            done
            npx vitest run "${suites[@]}"
          else
            npx vitest run "src/verify/$SUITE.test.ts"
          fi
      - if: matrix.suite == 'structure'
        run: npm run python:curriculum -- --check

  deploy:
    name: Deploy to Netlify (production)
    needs: [checks, verify, python, workflows]
    # Production only, from main. Pull requests are never deployed by CI: GitHub runs a pull request's own copy of this
    # workflow, so a pull request job must never be able to reach the Netlify token (it is stored on the `production`
    # environment, whose deployment branches are limited to main).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # This job holds the Netlify token, so it never installs or runs repository code: it deploys the dist artifact built
      # by `checks` from a directory outside the checkout that holds only dist/ and netlify.toml (no project .npmrc or
      # package.json can steer npx).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: netlify.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/site/dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice title=Deploy skipped::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are not set on the production environment (see CONTRIBUTING.md \"CI and deploy\")."
            exit 0
          fi
          cp netlify.toml "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          npx --yes netlify-cli@27.13.0 deploy --no-build --dir dist --prod --message "${GITHUB_SHA::7}" --json > "$RUNNER_TEMP/deploy.json"
          url=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).url)' "$RUNNER_TEMP/deploy.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test production (worker CSP, SPA fallback, Pyodide files)
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: npm run smoke:worker-csp -- --url "$DEPLOY_URL" --dist dist
