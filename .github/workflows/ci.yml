name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build
      - name: Smoke test the build under vite preview (worker CSP, SPA fallback, Pyodide files)
        run: npm run smoke:worker-csp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  python:
    name: Python lessons on CPython (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - run: python -m pip install --require-hashes -r tests/python/requirements.txt
      - run: python -m pytest

  workflows:
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Security audits of the workflows themselves (template injection, excessive permissions, unpinned uses,
      # dangerous triggers). Offline: no GitHub API calls, so it needs no token.
      - run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity low .github/workflows

  verify:
    name: Verify ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - structure
          - typescript
          - react
          - react-state
          - architecture
          - ai-engineering
          - node
          - python
          - vue
          - angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Pyodide packages (re-verified against pyodide-lock.json by postinstall)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/pyodide-packages
          key: pyodide-packages-${{ hashFiles('vendor/pyodide-packages/manifest.json', 'package-lock.json') }}
      - run: npm ci
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "structure" ]; then
            suites=()
            for file in src/verify/*.test.ts; do
              case "$(basename "$file" .test.ts)" in
                typescript|react|react-state|architecture|ai-engineering|node|python|vue|angular) ;;
                *) suites+=("$file") ;;
              esac
            done
            npx vitest run "${suites[@]}"
          else
            npx vitest run "src/verify/$SUITE.test.ts"
          fi
      - if: matrix.suite == 'structure'
        run: npm run python:curriculum -- --check

  smoke:
    name: Smoke test the Netlify deploy (worker CSP, SPA fallback, Pyodide files)
    # Netlify deploys through its Git integration (Deploy Previews for pull requests, production from main); CI holds no
    # Netlify token. This job checks what Netlify actually serves against the dist artifact built from the same commit.
    # Fork pull requests are skipped: their previews may wait for approval in Netlify.
    needs: checks
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # check out the repository and read the dist artifact
      statuses: read # read Netlify's deploy-preview commit status
    env:
      PRODUCTION_URL: https://adv-dv-doj.netlify.app
      PREVIEW_STATUS: netlify/adv-dv-doj/deploy-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Wait for the Netlify deploy and check it
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            url=""
            for _ in $(seq 1 40); do
              status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" --jq ".statuses[] | select(.context == \"$PREVIEW_STATUS\") | .state + \" \" + .target_url")
              case "$status" in
                success\ *) url=${status#success }; break ;;
                failure\ *|error\ *) echo "::error title=Deploy Preview::Netlify reported $status"; exit 1 ;;
              esac
              sleep 30
            done
            if [ -z "$url" ]; then
              echo "::error title=Deploy Preview::no successful $PREVIEW_STATUS status after 20 minutes"
              exit 1
            fi
            npm run smoke:worker-csp -- --url "$url" --dist dist
          else
            # Netlify reports no status for production deploys: retry until the live site serves this build.
            for attempt in $(seq 1 30); do
              if npm run --silent smoke:worker-csp -- --url "$PRODUCTION_URL" --dist dist; then exit 0; fi
              echo "attempt $attempt: production does not serve this build yet"
              sleep 30
            done
            echo "::error title=Production::$PRODUCTION_URL did not serve this build within 15 minutes"
            exit 1
          fi
