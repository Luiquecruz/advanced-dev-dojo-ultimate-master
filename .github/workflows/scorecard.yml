name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly, like security.yml: the score also depends on repository settings (branch protection, reviews).
    - cron: '41 6 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # read workflow runs (CI-Tests, Dangerous-Workflow checks)
      contents: read # check out and analyse the repository
      security-events: write # upload results to code scanning
      id-token: write # sign the result published to the public Scorecard API, which backs the README badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
