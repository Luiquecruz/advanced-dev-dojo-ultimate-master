name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new advisory against an unchanged lockfile still surfaces.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-audit:
    name: npm audit
    # Not on pull requests: a new advisory against a dependency already on main would fail every unrelated pull request.
    # Pull requests get dependency-review and osv-scan-pr, which report only what the pull request adds.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=moderate

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Fake credentials that lessons use on purpose are listed by fingerprint in .gitleaksignore. `--log-opts` replaces
      # gitleaks' default (--full-history --all --diff-filter=tuxdb), so it is repeated, plus `-m` for merge commit diffs,
      # where a key added while resolving a conflict would otherwise go unseen.
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --no-banner --redact --log-opts="--full-history --all --diff-filter=tuxdb -m" --gitleaks-ignore-path /repo/.gitleaksignore

  dependency-review:
    name: Dependency review (new dependencies in this pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Fails when the pull request adds a dependency with a known vulnerability of moderate severity or more.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  osv-scan:
    name: OSV-Scanner (npm and Python lockfiles)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read # read the workflow run, for the SARIF upload
      contents: read # check out the repository
      security-events: write # upload results to code scanning

  osv-scan-pr:
    name: OSV-Scanner (new vulnerabilities in this pull request)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read # read the workflow run, for the SARIF upload
      contents: read # check out the repository
      security-events: write # upload results to code scanning

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # read the workflow run, for the SARIF upload
      contents: read # check out the repository
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - src/content/*/**
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
