[build]
  # postinstall skips the .NET vendor step on Netlify; it runs here, after plugins/netlify-dotnet-cache restored its downloads.
  command = "npm run csharp:vendor && npm run build"
  publish = "dist"

[[plugins]]
  package = "./plugins/netlify-dotnet-cache"

[[headers]]
  for = "/assets/python.worker-*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'"

[[headers]]
  for = "/assets/csharp.worker-*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'"

# dotnet/<version>/ (plugins/dotnetPlugin.ts): the version is the hash of the served set, so every path names fixed content.
[[headers]]
  for = "/dotnet/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sentry tunnel (plugins/sentryTunnel.ts): the SDK posts envelopes to /signal and Netlify proxies them to the project of the DSN.
# The target is sentryEnvelopeUrl(VITE_SENTRY_DSN); src/app/monitoring/tunnel.test.ts checks it against the DSN in ci.yml.
[[redirects]]
  from = "/signal"
  to = "https://o4512380997074944.ingest.us.sentry.io/api/4512381161308160/envelope/"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
